<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MadaKop – Online Delivery Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase_config.js"></script>
<style>
:root{--lime:#bfff3c;--pink:#e91e8c;--dark:#0d0d0d;--card:#161616;--card2:#1c1c1c;--white:#f5f5f0;--grey:rgba(245,245,240,.62);--border:rgba(191,255,60,.12);--shadow:0 20px 40px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#090909;color:#f2f2f0;font-family:'DM Sans',sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
.page-wrap{max-width:1040px;margin:20px auto;padding:20px}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.top-bar h1{font-family:'Bebas Neue';font-size:2rem;letter-spacing:3px;color:var(--lime)}
.btn-outline{display:inline-block;padding:10px 16px;border:1.5px solid var(--lime);color:var(--lime);border-radius:6px;font-size:.8rem;text-transform:uppercase;font-weight:700;transition:all .2s}
.btn-outline:hover{background:var(--lime);color:var(--dark)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.panel h2{font-family:'Bebas Neue';font-size:1.35rem;letter-spacing:1.8px;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
label{display:block;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid rgba(191,255,60,.2);border-radius:6px;background:#0f0f0f;color:#fff;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--lime)}
small{text-transform:uppercase;color:#8f8f8f;letter-spacing:1px}
.flex-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-primary{background:var(--lime);color:var(--dark);border:none;text-transform:uppercase;font-weight:700;padding:10px 16px;border-radius:6px;cursor:pointer;transition:all .2s}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(191,255,60,.35)}
.btn-secondary{background:var(--pink);color:#fff;border:none;text-transform:uppercase;font-weight:700;padding:10px 14px;border-radius:6px;cursor:pointer;transition:all .2s}
.btn-secondary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(233,30,140,.35)}
.toast{background:rgba(191,255,60,.15);border:1px solid rgba(191,255,60,.35);color:#f8f8f0;padding:10px 14px;border-radius:5px;min-height:38px;display:flex;align-items:center;gap:8px;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:14px}
thead th{border-bottom:1px solid var(--border);padding:8px;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;color:#a7a7a7;text-align:left}
tbody td{padding:10px 8px;border-bottom:1px solid rgba(191,255,60,.1);font-size:.82rem;color:#eee}
.status-chip{display:inline-block;font-size:.68rem;font-weight:700;padding:3px 7px;border-radius:999px;text-transform:uppercase}
.status-new{background:rgba(191,255,60,.2);color:var(--lime)}
.status-picked{background:rgba(233,30,140,.2);color:var(--pink)}
.status-delivered{background:rgba(0,180,255,.3);color:#00d7ff}
.small-link{font-size:.75rem;color:var(--lime)}
@media(max-width:820px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="top-bar">
    <h1>MadaKop Delivery</h1>
    <a class="btn-outline" href="index.html">← Back Home</a>
  </div>

  <div class="panel" aria-label="Delivery Order Form">
    <h2>1) Place Delivery Order</h2>
    <div class="form-grid">
      <div>
        <label for="custName">Full Name</label>
        <input id="custName" type="text" placeholder="John Doe" required>
      </div>
      <div>
        <label for="custPhone">Phone (WhatsApp)</label>
        <input id="custPhone" type="tel" placeholder="+2773 123 4567" required>
      </div>
      <div>
        <label for="custEmail">Email (optional)</label>
        <input id="custEmail" type="email" placeholder="name@example.com">
      </div>
      <div>
        <label for="addressLine">Street Address</label>
        <input id="addressLine" type="text" placeholder="123 High St" required>
      </div>
      <div>
        <label for="addressCity">City / Suburb</label>
        <input id="addressCity" type="text" placeholder="Evaton" required>
      </div>
      <div>
        <label for="addressZip">Postal Code</label>
        <input id="addressZip" type="text" placeholder="1984" required>
      </div>
      <div>
        <label for="productSelect">Product</label>
        <select id="productSelect"></select>
      </div>
      <div>
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" min="1" value="1" required>
      </div>
      <div>
        <label>COD Product</label>
        <div class="flex-row"><input id="codProduct" type="checkbox"><small>Pay product on delivery</small></div>
      </div>
      <div>
        <label>COD Delivery</label>
        <div class="flex-row"><input id="codDelivery" type="checkbox"><small>Pay delivery fee on delivery</small></div>
      </div>
      <div>
        <label for="driverNote">Delivery Notes</label>
        <textarea id="driverNote" rows="3" placeholder="Gate code, landmark, arrival instructions"></textarea>
      </div>
    </div>
    <div style="margin-top:14px" class="flex-row">
      <button class="btn-primary" id="submitOrder">Submit Order</button>
      <button class="btn-secondary" id="sendToWhatsApp">Send WhatsApp Alert</button>
      <span id="orderRate" style="color:#8f8f8f;font-size:.82rem"></span>
    </div>
    <div class="toast" id="toastMsg" style="display:none"></div>
  </div>

  <div class="panel" aria-label="Active Orders">
    <h2>2) Active Orders (Local)</h2>
    <table id="ordersTable">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Product</th><th>Total</th><th>Location</th><th>Contact</th><th>Status</th><th>Driver</th></tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
    <p style="margin-top:10px;color:#8f8f8f;font-size:.78rem">* Fresh orders are saved in browser local storage. Admin/driver links are generated instantly.</p>
  </div>
</div>

<script>
const ADMIN_NUMBER = '27736292224';
const DRIVER_NUMBER = '27730000000';
const STORAGE_KEY = 'madaKopDeliveryOrders';
const PRODUCTS = [
  {id:'garden-reserve', name:'Garden Reserve Indoor (1 pack)', price:450},
  {id:'outdoor-blend', name:'Outdoor Blend Pack (1 pack)', price:380},
  {id:'cbd-relief', name:'CBD Relief Bud (1 pack)', price:420},
  {id:'live-resin', name:'Live Resin Wax (1g)', price:500},
  {id:'robin-gold', name:'Rosin Press Gold (1g)', price:520}
];

const form = {
  name: document.getElementById('custName'),
  phone: document.getElementById('custPhone'),
  email: document.getElementById('custEmail'),
  addressLine: document.getElementById('addressLine'),
  city: document.getElementById('addressCity'),
  zip: document.getElementById('addressZip'),
  product: document.getElementById('productSelect'),
  qty: document.getElementById('quantity'),
  codProduct: document.getElementById('codProduct'),
  codDelivery: document.getElementById('codDelivery'),
  note: document.getElementById('driverNote')
};

function formatCurrency(n){return 'R' + Number(n).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});}

function toast(message){const toastEl=document.getElementById('toastMsg');toastEl.textContent=message;toastEl.style.display='flex';setTimeout(()=>toastEl.style.display='none',3200);}

function loadProductOptions(){
  form.product.innerHTML='' ;
  PRODUCTS.forEach(p=>{const op=document.createElement('option');op.value=p.id;op.textContent=`${p.name} - ${formatCurrency(p.price)}`;form.product.appendChild(op);});
}

function getSavedOrders(){
  try {return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}catch(e){return[];}
}

function saveOrders(list){localStorage.setItem(STORAGE_KEY, JSON.stringify(list));}

function calculateTotalling(){
  const p = PRODUCTS.find(it=>it.id===form.product.value) || PRODUCTS[0];
  const qty = Math.max(1, Number(form.qty.value)||1);
  const productTotal = p.price * qty;
  const deliveryFee = 80;
  const total = productTotal + deliveryFee;
  document.getElementById('orderRate').textContent = `Product: ${formatCurrency(productTotal)} + Delivery: ${formatCurrency(deliveryFee)} = ${formatCurrency(total)}`;
  return {productTotal, deliveryFee, total, selectedProduct:p};
}

function buildWhatsAppLink(targetNumber, order){
  const msg = encodeURIComponent(`*MadaKop New Delivery Order*\nOrder ID: ${order.id}\nName: ${order.name}\nPhone: ${order.phone}\nAddress: ${order.addressLine}, ${order.city}, ${order.zip}\nProduct: ${order.productName} ×${order.quantity} (R${order.productTotal.toFixed(2)})\nDelivery fee: R${order.deliveryFee.toFixed(2)}\nTotal: R${order.total.toFixed(2)}\nCOD Product: ${order.codProduct?'Yes':'No'}\nCOD Delivery: ${order.codDelivery?'Yes':'No'}\nNote: ${order.note || '-'}\nStatus: ${order.status}`);
  return `https://wa.me/${targetNumber}?text=${msg}`;
}

function persistOrder(order){
  const list = getSavedOrders();
  list.unshift(order);
  saveOrders(list);
  renderOrders();
}

function renderOrders(){
  const body = document.getElementById('ordersBody');
  const orders = getSavedOrders();
  if(!orders.length){
    body.innerHTML = `<tr><td colspan="8" style="color:#8f8f8f;text-align:center;padding:14px">No current orders. Create one through the form above.</td></tr>`;
    return;
  }
  body.innerHTML = orders.map(o=>{
    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.addressLine + ', ' + o.city + ' ' + o.zip)}`;
    return `<tr>
      <td>${o.id}</td>
      <td>${o.name}</td>
      <td>${o.productName} ×${o.quantity}</td>
      <td>${formatCurrency(o.total)}</td>
      <td><a class="small-link" href="${mapUrl}" target="_blank">Map</a></td>
      <td><a class="small-link" href="https://wa.me/${o.phone.replace(/\D/g,'')}?text=Hi%20MadaKop%20team" target="_blank">WhatsApp</a></td>
      <td><span class="status-chip status-${o.status.replace(/\s+/g,'').toLowerCase()}">${o.status}</span></td>
      <td><button class="btn-outline" onclick="updateOrderStatus('${o.id}','Delivered')">Mark Delivered</button></td>
    </tr>`;
  }).join('');
}

function createOrder(){
  if(!form.name.value.trim() || !form.phone.value.trim() || !form.addressLine.value.trim() || !form.city.value.trim() || !form.zip.value.trim()){
    toast('Fill all required fields before submitting.');
    return;
  }
  const {productTotal, deliveryFee, total, selectedProduct} = calculateTotalling();
  const order = {
    id: 'MK'+Date.now(),
    name: form.name.value.trim(),
    phone: form.phone.value.trim(),
    email: form.email.value.trim(),
    addressLine: form.addressLine.value.trim(),
    city: form.city.value.trim(),
    zip: form.zip.value.trim(),
    productId: selectedProduct.id,
    productName: selectedProduct.name,
    quantity: Number(form.qty.value)||1,
    productTotal,
    deliveryFee,
    total,
    codProduct: form.codProduct.checked,
    codDelivery: form.codDelivery.checked,
    note: form.note.value.trim(),
    status: 'New',
    createdAt: new Date().toISOString()
  };
  persistOrder(order);
  toast('Order stored locally. Tap WhatsApp alert next.');
  return order;
}

function sendAlerts(order){
  const adminUrl = buildWhatsAppLink(ADMIN_NUMBER, order);
  const driverUrl = buildWhatsAppLink(DRIVER_NUMBER, order);

  window.open(adminUrl,'_blank');
  setTimeout(()=>window.open(driverUrl,'_blank'),200);

  toast('WhatsApp alerts generated for admin and driver.');
}

function updateOrderStatus(orderId,newStatus){
  const orders = getSavedOrders();
  const found = orders.find(o=>o.id===orderId);
  if(!found) return;
  found.status = newStatus;
  saveOrders(orders);
  renderOrders();
}

window.addEventListener('DOMContentLoaded',()=>{
  loadProductOptions();
  renderOrders();
  document.getElementById('submitOrder').addEventListener('click',()=>{
    const order = createOrder();
    if(order) {
      if(confirm('Send WhatsApp alerts now?')) sendAlerts(order);
    }
  });
  document.getElementById('sendToWhatsApp').addEventListener('click',()=>{
    const order = createOrder();
    if(order) sendAlerts(order);
  });
  form.product.addEventListener('change',calculateTotalling);
  form.qty.addEventListener('input',calculateTotalling);
  calculateTotalling();
});
</script>
</body>
</html>
