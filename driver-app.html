<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<meta name='robots' content='noindex,nofollow'>
<title>MadaKop Driver</title>
<style>
:root{--bg:#0b0b0f;--card:#15151c;--line:#262633;--text:#f4f4f7;--mute:#9a9ab0;--lime:#a3e635;--pink:#ff2d95;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-weight:900;letter-spacing:1px;color:var(--lime)}.brand span{color:var(--pink)}
main{padding:16px;max-width:620px;margin:0 auto}
h3{margin:18px 0 8px;color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input{background:#0f0f15;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;width:100%}
.btn{background:var(--lime);color:#0b0b0f;border:0;border-radius:12px;padding:14px 18px;font-weight:800;cursor:pointer;font-size:16px;width:100%;margin-top:8px}
.btn.pink{background:var(--pink);color:#fff}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn:disabled{opacity:.5}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;display:grid;gap:10px}
.err{color:var(--bad);min-height:18px;font-size:13px}
.mute{color:var(--mute)}.small{font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;margin:4px 0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#26263a}
.s-new{background:var(--pink);color:#fff}.s-confirmed{background:#3b82f6;color:#fff}.s-picked,.s-out_for_delivery{background:var(--warn);color:#111}.s-delivered{background:var(--lime);color:#111}
.links a{color:var(--lime);margin-right:16px;font-weight:700}
.cash{background:#3a2d10;color:var(--warn);border-radius:10px;padding:8px 12px;font-weight:700;margin:8px 0}
.map{width:100%;height:190px;border:0;border-radius:10px;margin:8px 0 2px;background:#0f0f15}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222232;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:30;max-width:92vw}
#toast.bad{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>

<section id='login' class='center'>
  <form id='loginForm' class='box card'>
    <div class='brand' style='font-size:22px'>MADA<span>KOP</span> <span class='mute' style='font-size:13px;letter-spacing:0'>Driver</span></div>
    <input id='email' type='email' placeholder='Email' autocomplete='username' required>
    <input id='password' type='password' placeholder='Password' autocomplete='current-password' required>
    <button class='btn' type='submit'>Sign in</button>
    <div class='err' id='loginMsg'></div>
  </form>
</section>

<div id='app' hidden>
  <header><div class='brand'>MADA<span>KOP</span></div><div><span class='mute small' id='who'></span> <button class='ghost' id='logout'>Sign out</button></div></header>
  <main>
    <h3>Active deliveries</h3>
    <div id='active'></div>
    <h3>Completed</h3>
    <div id='done'></div>
  </main>
</div>
<div id='toast' hidden></div>

<script>
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split(String.fromCharCode(39)).join('&#39;');
const money = n => 'R' + Number(n || 0).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const when = d => d ? new Date(d).toLocaleString('en-ZA', { dateStyle: 'medium', timeStyle: 'short' }) : '';
const STATUS = { new: 'Awaiting confirmation', confirmed: 'Ready to collect', picked: 'Picked up', out_for_delivery: 'Out for delivery', delivered: 'Delivered' };
const NEXT = { confirmed: ['picked', 'Picked up'], picked: ['out_for_delivery', 'Out for delivery'], out_for_delivery: ['delivered', 'Mark delivered'] };
const badge = s => `<span class='badge s-${esc(s)}'>${esc(STATUS[s] || s)}</span>`;

let S = null, timer = null, orders = {}, lastSig = '';
try { S = JSON.parse(sessionStorage.getItem('mk_driver')); } catch (e) { S = null; }

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3500);
}
function save(j) { S = j; sessionStorage.setItem('mk_driver', JSON.stringify(j)); }
function signOut() { sessionStorage.removeItem('mk_driver'); S = null; lastSig = ''; clearInterval(timer); $('#app').hidden = true; $('#login').hidden = false; }
async function refresh() {
  if (!S || !S.refresh_token) return false;
  const r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'refresh', refresh_token: S.refresh_token }) });
  if (!r.ok) return false;
  save(await r.json()); return true;
}
async function api(path, opts) {
  opts = opts || {};
  const go = () => fetch(path, { method: opts.method || 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (S ? S.access_token : '') }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let r = await go();
  if (r.status === 401 && await refresh()) r = await go();
  if (r.status === 401) { signOut(); throw new Error('Session expired, please sign in again'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginMsg').textContent = '';
  try {
    const r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', email: $('#email').value, password: $('#password').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Login failed');
    const role = j.profile && j.profile.role;
    if (role !== 'driver' && role !== 'staff' && role !== 'admin') throw new Error('This account is not a driver account');
    save(j); $('#password').value = ''; start();
  } catch (err) { $('#loginMsg').textContent = err.message; }
});
$('#logout').onclick = signOut;

function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  $('#who').textContent = (S.profile && S.profile.full_name) || S.user.email;
  guard(load)();
  clearInterval(timer);
  timer = setInterval(() => guard(load)(), 20000);
}

function card(o) {
  const addr = [o.address_line, o.city, o.zip].filter(Boolean).join(', ');
  const hasPin = o.latitude != null && o.longitude != null;
  const target = hasPin ? o.latitude + ',' + o.longitude : addr;
  const embed = 'https://maps.google.com/maps?q=' + encodeURIComponent(target) + '&z=16&output=embed';
  const gmaps = hasPin ? 'https://www.google.com/maps/dir/?api=1&destination=' + o.latitude + ',' + o.longitude : 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(addr);
  const waze = hasPin ? 'https://waze.com/ul?ll=' + o.latitude + ',' + o.longitude + '&navigate=yes' : 'https://waze.com/ul?q=' + encodeURIComponent(addr) + '&navigate=yes';
  const tel = 'tel:' + String(o.customer_phone || '').replace(/[^0-9+]/g, '');
  const cash = o.payment_method === 'cod' && o.payment_status !== 'paid' && o.status !== 'delivered';
  const next = NEXT[o.status];
  return `<div class='card' data-id='${esc(o.id)}'>
    <div class='row'><b>${esc(o.order_number)}</b>${badge(o.status)}</div>
    <div><b>${esc(o.customer_name)}</b><br>${esc(addr)}</div>
    ${o.delivery_note ? `<div class='small mute'>Note: ${esc(o.delivery_note)}</div>` : ''}
    <iframe class='map' loading='lazy' referrerpolicy='no-referrer-when-downgrade' title='Delivery location' src='${esc(embed)}'></iframe>
    <div class='small ${hasPin ? '' : 'mute'}' style='${hasPin ? 'color:var(--lime)' : ''}'>${hasPin ? 'Exact pin shared by the customer' : 'Approximate - based on the typed address'}</div>
    <div class='links' style='margin:8px 0'><a href='${esc(tel)}'>Call</a><a href='${esc(gmaps)}' target='_blank' rel='noopener noreferrer'>Google Maps</a><a href='${esc(waze)}' target='_blank' rel='noopener noreferrer'>Waze</a></div>
    <div class='small mute'>${(o.items || []).map(i => esc(i.quantity) + ' x ' + esc(i.product_name)).join(', ')}</div>
    ${cash ? `<div class='cash'>Collect cash: ${money(o.total)}</div>` : ''}
    ${next ? `<button class='btn ${next[0] === 'delivered' ? 'pink' : ''}' data-status='${next[0]}'>${esc(next[1])}</button>` : ''}
  </div>`;
}

async function load() {
  const j = await api('/api/driver');
  // only redraw when something changed, so the maps do not reload every 20 seconds
  const sig = JSON.stringify((j.orders || []).map(o => [o.id, o.status, o.payment_status, o.latitude, o.longitude]));
  if (sig === lastSig) return;
  lastSig = sig;
  orders = {}; (j.orders || []).forEach(o => { orders[o.id] = o; });
  const act = (j.orders || []).filter(o => o.status !== 'delivered' && o.status !== 'cancelled');
  const done = (j.orders || []).filter(o => o.status === 'delivered').slice(0, 10);
  $('#active').innerHTML = act.map(card).join('') || `<div class='card mute'>No deliveries assigned to you right now.</div>`;
  $('#done').innerHTML = done.map(o => `<div class='card'><div class='row'><b>${esc(o.order_number)}</b>${badge(o.status)}</div><div class='small mute'>${esc(o.customer_name)} - ${esc(when(o.delivered_at))}</div></div>`).join('') || `<div class='mute small'>Nothing completed yet.</div>`;
}

document.addEventListener('click', guard(async e => {
  const b = e.target.closest('button[data-status]'); if (!b) return;
  const id = b.closest('[data-id]').dataset.id;
  if (b.dataset.status === 'delivered' && !confirm('Mark this order as delivered?')) return;
  b.disabled = true;
  try {
    await api('/api/driver', { method: 'PATCH', body: { order_id: id, status: b.dataset.status } });
    toast('Updated');
  } finally { await load(); }
}));

if (S && S.access_token) start();
</script>
</body>
</html>
